<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080808">
  <meta name="description" content="CANREVIEW 추천 영화와 공식 채널 링크">
  <title>CANREVIEW | 영화 보러가기</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #080808;
      --surface: #151515;
      --surface-hover: #1e1e1e;
      --text: #ffffff;
      --muted: #a7a7a7;
      --line: #2b2b2b;
      --watcha: #ff0558;
      --youtube: #ff0033;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 50% -10%, rgba(255, 5, 88, .22), transparent 36%),
        var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
    }

    main {
      width: min(100%, 520px);
      margin: 0 auto;
      padding: calc(44px + env(safe-area-inset-top)) 20px
        calc(34px + env(safe-area-inset-bottom));
    }

    header { text-align: center; margin-bottom: 30px; }

    .avatar {
      display: grid;
      place-items: center;
      width: 76px;
      height: 76px;
      margin: 0 auto 16px;
      border: 2px solid rgba(255,255,255,.88);
      border-radius: 50%;
      background: #fff;
      color: #090909;
      font-size: 1.35rem;
      font-weight: 900;
      letter-spacing: -.06em;
      box-shadow: 0 14px 40px rgba(0,0,0,.45);
    }

    h1 {
      margin: 0;
      font-size: 1.62rem;
      line-height: 1.25;
      letter-spacing: -.035em;
    }

    .handle {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 1rem;
    }

    .links { display: grid; gap: 13px; }

    .link {
      display: grid;
      grid-template-columns: 42px 1fr 22px;
      align-items: center;
      min-height: 72px;
      padding: 12px 16px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--surface);
      color: var(--text);
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
      transition: transform .14s ease, background .14s ease, border-color .14s ease;
    }

    .link:hover,
    .link:focus-visible {
      background: var(--surface-hover);
      border-color: #4a4a4a;
      outline: none;
      transform: translateY(-1px);
    }

    .link:active { transform: scale(.99); }

    .icon {
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 900;
    }

    .youtube .icon { background: var(--youtube); }
    .watcha .icon { background: var(--watcha); }

    .copy { min-width: 0; padding: 0 10px; }
    .copy strong { display: block; font-size: 1.02rem; line-height: 1.35; }
    .copy span {
      display: block;
      margin-top: 2px;
      overflow: hidden;
      color: var(--muted);
      font-size: .88rem;
      line-height: 1.35;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .arrow { color: #8d8d8d; font-size: 1.3rem; text-align: right; }

    .disclosure {
      margin: 18px 4px 0;
      color: #8d8d8d;
      font-size: .78rem;
      line-height: 1.55;
      text-align: center;
    }

    footer {
      margin-top: 30px;
      color: #666;
      font-size: .76rem;
      text-align: center;
    }

    @media (max-width: 360px) {
      main { padding-right: 14px; padding-left: 14px; }
      .link { padding-right: 13px; padding-left: 13px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="avatar" aria-hidden="true">CR</div>
      <h1>CANREVIEW</h1>
      <p class="handle">영화·드라마, 짧고 재밌게</p>
    </header>

    <section class="links" aria-label="CANREVIEW 링크">
      <a class="link youtube" href="https://www.youtube.com/@canreview9" target="_blank" rel="noopener">
        <span class="icon" aria-hidden="true">▶</span>
        <span class="copy">
          <strong>유튜브 채널</strong>
          <span>CANREVIEW 영상 더 보기</span>
        </span>
        <span class="arrow" aria-hidden="true">›</span>
      </a>

      <a class="link watcha" href="https://watcha.com/af/0/d8_wsZ" target="_blank" rel="sponsored noopener">
        <span class="icon" aria-hidden="true">W</span>
        <span class="copy">
          <strong>〈테이큰〉 왓챠에서 보기</strong>
          <span>작품 감상 페이지로 이동</span>
        </span>
        <span class="arrow" aria-hidden="true">›</span>
      </a>
    </section>

    <p class="disclosure">
      이 페이지는 왓챠 큐레이터 활동의 일환으로,<br>
      구매 시 이에 따른 일정액의 수수료를 제공받습니다.
    </p>

    <footer>© CANREVIEW</footer>
  </main>
</body>
</html>
